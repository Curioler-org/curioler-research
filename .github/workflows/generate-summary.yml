name: Generate Research Summary

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: "Search topic (e.g. autism early signs in toddlers)"
        required: true
        type: string
      domain:
        description: "Research domain"
        required: true
        type: choice
        options:
          - General
          - Communication
          - Social
          - Sensory
          - Behaviour
          - Adaptive
          - Motor

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r agent/requirements.txt

      - name: Run research agent
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SEARCH_QUERY: ${{ github.event.inputs.search_query }}
          SEARCH_DOMAIN: ${{ github.event.inputs.domain }}
        run: |
          echo "⚠️  This workflow requires the claude CLI with an authenticated session."
          echo "Run locally instead: SEARCH_QUERY='...' SEARCH_DOMAIN='...' python agent/generate_summary.py"
          exit 1

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: draft/summary-${{ github.run_number }}
          title: "Draft summary: ${{ github.event.inputs.search_query }}"
          body: |
            Automated research summary generated by the Curioler agent.

            **Topic:** ${{ github.event.inputs.search_query }}
            **Domain:** ${{ github.event.inputs.domain }}

            Review the file in `docs/_summaries/` before merging.
            Merging this PR publishes the summary directly to GitHub Pages.
          commit-message: "Add draft summary: ${{ github.event.inputs.search_query }}"
          labels: draft, research-summary
