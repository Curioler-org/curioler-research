name: Daily PubMed Ingestion

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum new studies to process"
        required: false
        default: "25"

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run PubMed ingestion
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'openrouter' }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PUBMED_EMAIL: ${{ secrets.PUBMED_EMAIL }}
          PUBMED_TOOL_NAME: ${{ secrets.PUBMED_TOOL_NAME }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '25' }}"
          python -m pipelines.pubmed.ingest --limit "$LIMIT" | tee pipeline-summary.txt

      - name: Add workflow summary
        if: always()
        run: |
          if [ -f pipeline-summary.txt ]; then
            {
              echo "## PubMed ingestion"
              echo
              cat pipeline-summary.txt
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit generated research updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw research docs/_studies docs/_data .github/workflows/pubmed-ingestion.yml
          if git diff --cached --quiet; then
            echo "No new research updates to commit."
          else
            git commit -m "Update PubMed research ingestion outputs"
            git push
          fi

      # Runs after the commit so a fetched paper is never lost to a red run.
      # A failure here means raw XML landed without a study record, which used to
      # go unnoticed until someone rebuilt the records by hand.
      - name: Check every raw capture has a study record
        run: python -m scripts.check_raw_coverage
