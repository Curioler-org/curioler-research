title: Curioler Research
description: Evidence-based research summaries for caregivers of autistic children.
baseurl: "/curioler-research"
url: "https://curioler-org.github.io"

collections:
  summaries:
    output: true
    permalink: /summaries/:name/

defaults:
  - scope:
      path: ""
      type: summaries
    values:
      layout: summary

markdown: kramdown
plugins:
  - jekyll-feed
